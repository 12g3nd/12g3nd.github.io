name: Deploy Vite site to Pages

on:
  push:
    branches: ["main"]
  # The Letterboxd ratings on /media are fetched at build time (the feed sends
  # no CORS headers, so the browser can't), which makes them exactly as fresh as
  # the last deploy. A nightly rebuild refreshes them without a push.
  # 07:00 UTC ≈ 03:00 Toronto — nobody is reading the site, and it is well clear
  # of the top of the hour when GitHub's scheduler is busiest.
  schedule:
    - cron: "0 7 * * *"
  # Manual trigger, for refreshing the feed without waiting for the cron.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two trigger sources can now race. Queue rather than cancel: a half-finished
# Pages deploy is worse than a redundant one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
