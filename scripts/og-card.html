<!doctype html>
<!--
  Source for the social share card (public/og-card.png).
  Rendered headless at exactly 1200×630 and screenshotted. To regenerate after
  edits: open this file in a browser sized to 1200×630 and capture the viewport,
  or re-run the headless screenshot step. Kept in the repo so the card stays
  editable instead of being a mystery binary.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }

      :root {
        --bg-base: #0A1320;
        --accent: #00E5FF;
        --cream: #FDF6E3;
      }

      body {
        position: relative;
        background: var(--bg-base);
        color: var(--cream);
        font-family: 'Space Mono', monospace;
        padding: 60px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* CRT scanlines — same treatment as the live site */
      body::before {
        content: '';
        position: absolute; inset: 0; pointer-events: none; z-index: 2;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.05) 3px
        );
      }
      /* Cyan corner glow */
      body::after {
        content: '';
        position: absolute; inset: 0; pointer-events: none; z-index: 1;
        background: radial-gradient(110% 120% at 82% 12%, rgba(0,229,255,0.12), transparent 58%);
      }

      .layer { position: relative; z-index: 3; }

      .top { display: flex; justify-content: space-between; align-items: baseline; }
      .brand {
        font-family: 'Anton', sans-serif;
        font-size: 36px; letter-spacing: 0.04em; color: var(--accent);
      }
      .boot {
        font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
        color: rgba(253,246,227,0.5);
      }
      .boot .ok { color: var(--accent); }

      .name { font-family: 'Anton', sans-serif; line-height: 0.88; }
      .name .l1 { display: block; font-size: 150px; letter-spacing: 0.01em; color: var(--cream); }
      .name .l2 {
        display: block; font-size: 150px; letter-spacing: 0.01em;
        color: transparent; -webkit-text-stroke: 2px var(--accent);
      }
      .phon { margin-top: 16px; font-size: 19px; color: rgba(253,246,227,0.48); }

      .tag {
        margin-top: 30px; font-size: 31px; font-weight: 700; line-height: 1.28;
        max-width: 980px;
      }
      .tag .accent { color: var(--accent); }

      .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
      .prompt { font-size: 22px; color: rgba(253,246,227,0.85); }
      .prompt .p { color: var(--accent); font-weight: 700; }
      .cursor {
        display: inline-block; width: 13px; height: 21px;
        background: var(--accent); margin-left: 5px; transform: translateY(3px);
      }
      .url { font-size: 20px; letter-spacing: 0.06em; color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="layer top">
      <div class="brand">SJ.SYS</div>
      <div class="boot">power-on self test <span class="ok">[ OK ]</span></div>
    </div>

    <div class="layer">
      <div class="name">
        <span class="l1">SRIHITH</span>
        <span class="l2">JARABANA</span>
      </div>
      <div class="phon">/sriːhɪθ dʒʊəˌræˈbɑːnə/</div>
      <div class="tag">
        Businessman by craft.
        <span class="accent">Builds things he probably shouldn't be able to.</span>
      </div>
    </div>

    <div class="layer bottom">
      <div class="prompt"><span class="p">srihith@sj.sys</span>:~$<span class="cursor"></span></div>
      <div class="url">jarabana.com</div>
    </div>
  </body>
</html>
