<!doctype html>
<!--
  Source for a per-poem social card (public/og/<slug>.png).

  Third sibling of og-card.html (site) and og-post-card.html (transmissions).
  scripts/capture-og-cards.mjs substitutes the {{...}} tokens and renders it
  headless at exactly 1200x630.

  Why this one is cream and not navy: the other two are dressed as the terminal
  because that is what the pages they link to are dressed as. The poetry page is
  dressed as a document, and the paper stock is the best-looking surface on the
  site — a poem arriving in a feed as a sheet of paper says what it is before
  anybody reads a word of it. The dark mount around the sheet is the same
  .doc-viewer the page renders it in.

  The AWARD token is emitted as an empty string for poems that have not won
  anything; the medal line is then hidden by :empty rather than by a second
  template. Tokens are named here without their braces on purpose — the capture
  script fills every occurrence, and a live token inside this comment would be
  one of them.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }

      :root {
        --bg-base: #0A1320;
        --paper: #f5ecd6;
        --ink: #2a2418;
        --ink-soft: #6b5e3f;
        --rule: rgba(42, 36, 24, 0.18);
        --accent: #00E5FF;
        --warm-ink: #a8651a;
        --title-size: 76px;
      }

      body {
        position: relative;
        background: var(--bg-base);
        font-family: 'Space Mono', monospace;
        padding: 44px 56px;
        display: flex;
        flex-direction: column;
      }

      /* The dark mount the viewer renders paper on, hatching and all. */
      body::before {
        content: '';
        position: absolute; inset: 0; z-index: 0;
        background:
          repeating-linear-gradient(135deg,
            rgba(253,246,227,0.02) 0px, rgba(253,246,227,0.02) 2px,
            transparent 2px, transparent 6px),
          #161616;
      }

      .chrome {
        position: relative; z-index: 2;
        display: flex; justify-content: space-between; align-items: center;
        padding: 0 4px 14px;
        font-size: 17px; letter-spacing: 0.06em;
        color: rgba(253,246,227,0.62);
      }
      .chrome .file { color: rgba(253,246,227,0.85); }
      .chrome .brand { color: var(--accent); font-weight: 700; letter-spacing: 0.14em; }

      /* The sheet. Same shadow stack as .doc-page on the live site. */
      .sheet {
        position: relative; z-index: 2;
        flex: 1;
        background: var(--paper);
        color: var(--ink);
        padding: 52px 64px 40px;
        display: flex; flex-direction: column;
        box-shadow:
          0 2px 0 rgba(0,0,0,0.4),
          0 14px 30px rgba(0,0,0,0.55),
          0 30px 60px rgba(0,0,0,0.35);
      }

      /* Award poems get the warm top accent, exactly as .doc-page--award does. */
      .sheet::before {
        content: '';
        position: absolute; inset: 0 0 auto 0; height: 5px;
        background: linear-gradient(90deg, rgba(0,0,0,0.12), rgba(0,0,0,0));
      }
      .sheet.award::before {
        background: linear-gradient(90deg, #ffb000, rgba(255,176,0,0) 70%);
      }

      .date {
        font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
        color: #8a7a52; margin-bottom: 14px;
      }

      .title {
        font-family: 'Source Serif 4', Georgia, serif;
        font-weight: 600;
        font-size: var(--title-size);
        line-height: 1.08;
        letter-spacing: -0.015em;
        color: #1a1611;
      }

      .medal {
        margin-top: 18px;
        font-family: 'Source Serif 4', Georgia, serif;
        font-style: italic;
        font-size: 21px;
        color: var(--warm-ink);
      }
      .medal:empty { display: none; }
      .medal::before { content: '✦  '; font-style: normal; }

      .rule { height: 1px; background: var(--rule); margin: 26px 0 22px; }

      .blurb {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 24px;
        line-height: 1.5;
        color: var(--ink-soft);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .foot {
        margin-top: auto;
        display: flex; justify-content: space-between; align-items: baseline;
        padding-top: 24px;
        border-top: 1px solid rgba(42,36,24,0.12);
        font-family: 'Space Mono', monospace;
        font-size: 15px; letter-spacing: 0.14em;
        color: #8a7a52;
      }
      .author {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 16px; letter-spacing: 0.2em; text-transform: uppercase;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="chrome">
      <span class="file">POETRY.pdf — {{SLUG}}</span>
      <span class="brand">SJ.SYS</span>
    </div>

    <div class="sheet {{AWARD_CLASS}}">
      <div class="date">{{DATE}}</div>
      <div class="title" id="title">{{TITLE}}</div>
      <div class="medal">{{AWARD}}</div>
      <div class="rule"></div>
      <div class="blurb">{{BLURB}}</div>
      <div class="foot">
        <span class="author">Srihith Jarabana</span>
        <span>— {{PAGE}} / {{TOTAL}} —</span>
      </div>
    </div>
  </body>
</html>
