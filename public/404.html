<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Srihith Jarabana</title>
    <!--
      SPA fallback for GitHub Pages. A hard request to a client-side route (e.g.
      /poetry) hits this 404, which encodes the path into a query string and
      redirects to "/". The restore snippet in index.html rewrites the URL back
      before React Router boots, so the in-app KERNEL PANIC page only shows for
      genuinely unknown routes. Root deploy → pathSegmentsToKeep = 0.
      Technique: rafgraph/spa-github-pages.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
