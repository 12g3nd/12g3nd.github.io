<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts: linked here (not @imported from CSS) so the browser discovers and
         fetches them immediately, in parallel, instead of waiting to download and
         parse the stylesheet first. preconnect warms the connection; display=swap
         paints fallback text right away, then swaps — no invisible-text delay. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap"
    />
    <!-- SPA redirect restore: decodes the path that 404.html encoded into the
         query string, rewriting the URL back before the app boots so deep links
         survive a hard refresh on GitHub Pages. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <title>Srihith Jarabana</title>
    <meta name="description" content="Businessman by craft. Builds things he probably shouldn't be able to. Projects, writing, and poetry inside SJ.SYS — the personal corner of Srihith Jarabana." />
    <!-- Open Graph (for social media & search engines) -->
    <meta property="og:title" content="Srihith Jarabana" />
    <meta property="og:description" content="Businessman by craft. Builds things he probably shouldn't be able to. Projects, writing, and poetry inside SJ.SYS." />
    <meta property="og:site_name" content="Srihith Jarabana" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.jarabana.com" />
    <meta property="og:image" content="https://www.jarabana.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="SJ.SYS — Srihith Jarabana. Businessman by craft. Builds things he probably shouldn't be able to." />
    <!-- Twitter / X large-image card (was missing entirely → X rendered a tiny thumbnail) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Srihith Jarabana" />
    <meta name="twitter:description" content="Businessman by craft. Builds things he probably shouldn't be able to. Projects, writing, and poetry inside SJ.SYS." />
    <meta name="twitter:image" content="https://www.jarabana.com/og-card.png" />
    <meta name="twitter:image:alt" content="SJ.SYS — Srihith Jarabana. Businessman by craft. Builds things he probably shouldn't be able to." />
    <link rel="canonical" href="https://www.jarabana.com" />
    <!-- Feed autodiscovery: how a reader finds the transmissions when someone
         hands it the bare domain instead of the feed URL. The file itself is
         generated at build time - see scripts/feedPlugin.ts. -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Transmissions // Srihith Jarabana"
      href="https://www.jarabana.com/feed.xml"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
